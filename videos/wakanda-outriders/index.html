<!--
  =============================================================================
  HYPERFRAMES 3D MOTION ENGINE - WAKANDA BATTLEFIELD RECORDER
  -----------------------------------------------------------------------------
  Features:
  1. Full 3D WebGL Three.js Simulation (Sunset Lighting, Bifrost, Warriors, Horde)
  2. Built-in MediaRecorder 1-Click Video Export (Downloads 1080x1920 MP4/WebM)
  =============================================================================
-->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU POV: Wakanda 3D Battle Simulator (Auto-Recording Edition)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Montserrat:ital,wght@0,800;0,900;1,900&family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body {
      background: #000;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #0d040a;
      overflow: hidden;
      box-shadow: 0 0 160px rgba(0, 0, 0, 1);
    }

    #webglCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .film-grain {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 40;
    }

    .cinematic-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(18, 4, 12, 0.92) 100%);
      pointer-events: none;
      z-index: 38;
    }

    /* Record / Export Control Panel */
    #exportPanel {
      position: absolute;
      top: 50px;
      right: 50px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 100;
    }

    .rec-btn {
      background: #ef4444;
      color: #fff;
      font-family: 'Montserrat', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 16px 36px;
      border-radius: 40px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.6);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .rec-btn:hover {
      transform: scale(1.05);
      background: #dc2626;
    }
    .rec-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
    }
    .recording .rec-dot {
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* Tactical HUD */
    #tacticalHud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 45;
      transition: opacity 0.5s ease;
    }

    .hud-compass {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 20px;
      font-family: 'Share Tech Mono', monospace;
      color: rgba(251, 146, 60, 0.85);
      font-size: 20px;
      letter-spacing: 4px;
    }
    .hud-compass-bar {
      width: 280px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(251, 146, 60, 0.85), transparent);
    }

    .vital-stat {
      position: absolute;
      left: 60px;
      top: 160px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.65);
      line-height: 1.6;
    }
    .vital-stat span { color: #38bdf8; font-weight: bold; }

    /* Top Floating POV Status Pill */
    .pov-badge {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(24, 10, 20, 0.88);
      border: 2px solid rgba(251, 146, 60, 0.45);
      backdrop-filter: blur(24px);
      padding: 18px 48px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      z-index: 50;
    }
    .hud-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f97316;
      box-shadow: 0 0 18px #f97316;
    }
    .pov-badge span {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
    }

    /* TikTok Subtitles */
    .caption-box {
      position: absolute;
      bottom: 220px;
      left: 60px;
      right: 60px;
      text-align: center;
      z-index: 50;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .caption-pill {
      background: rgba(14, 6, 12, 0.94);
      border: 2px solid rgba(251, 146, 60, 0.38);
      backdrop-filter: blur(28px);
      padding: 34px 54px;
      border-radius: 42px;
      box-shadow: 0 25px 85px rgba(0,0,0,0.95);
      display: inline-block;
    }
    .cap-word {
      display: inline-block;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 60px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.15;
      letter-spacing: -1px;
      color: #ffffff;
      margin: 0 10px;
      opacity: 0;
      transform: scale(0.6) translateY(24px);
    }
    .cap-word.highlight-neon { color: #22c55e; text-shadow: 0 0 35px rgba(34, 197, 94, 0.9); }
    .cap-word.highlight-gold { color: #fbbf24; text-shadow: 0 0 35px rgba(251, 191, 36, 0.9); }
    .cap-word.highlight-cyan { color: #38bdf8; text-shadow: 0 0 35px rgba(56, 189, 248, 0.9); }
    .cap-word.highlight-red { color: #ef4444; text-shadow: 0 0 35px rgba(239, 68, 68, 0.9); }

    #flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 60;
    }
  </style>
</head>
<body>

<div id="stage">
  <div id="webglCanvas"></div>

  <!-- Export Control Panel -->
  <div id="exportPanel">
    <button class="rec-btn" id="recordBtn" onclick="toggleRecording()">
      <div class="rec-dot"></div>
      <span id="btnText">RECORD VIDEO</span>
    </button>
  </div>

  <div id="tacticalHud">
    <div class="hud-compass">
      <span>120° SE</span>
      <div class="hud-compass-bar"></div>
      <span>WAKANDA PERIMETER</span>
    </div>
    <div class="vital-stat">
      SHIELD: <span id="shieldStat">100%</span><br>
      THREATS: <span id="threatStat" style="color:#ef4444;">CRITICAL</span><br>
      ALLIES: <span id="allyStat">40 UNITS</span>
    </div>
  </div>

  <div class="pov-badge">
    <div class="hud-dot" id="hudDot"></div>
    <span id="hudLabel">3D POV • WAKANDA FRONTLINE</span>
  </div>

  <div class="caption-box">
    <div class="caption-pill" id="captionTarget"></div>
  </div>

  <div id="flash"></div>
  <div class="cinematic-vignette"></div>
  <div class="film-grain"></div>
</div>

<script>
  // =========================================================================
  // VIDEO RECORDER ENGINE (1-CLICK MP4/WEBM EXPORT)
  // =========================================================================
  let mediaRecorder = null;
  let recordedChunks = [];
  let isRecording = false;

  function toggleRecording() {
    const canvas = document.querySelector('#webglCanvas canvas');
    if (!canvas) return;

    if (!isRecording) {
      recordedChunks = [];
      const stream = canvas.captureStream(60); // Capture at 60 FPS
      const mime = MediaRecorder.isTypeSupported("video/mp4") ? "video/mp4" : "video/webm";
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 25000000 }); // 25 Mbps high bitrate

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = exportVideoFile;

      mediaRecorder.start();
      isRecording = true;
      document.getElementById('recordBtn').classList.add('recording');
      document.getElementById('btnText').textContent = 'STOP & DOWNLOAD';
    } else {
      mediaRecorder.stop();
      isRecording = false;
      document.getElementById('recordBtn').classList.remove('recording');
      document.getElementById('btnText').textContent = 'RECORD VIDEO';
    }
  }

  function exportVideoFile() {
    const blob = new Blob(recordedChunks, { type: recordedChunks[0]?.type || 'video/mp4' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.style.display = 'none';
    a.href = url;
    a.download = `wakanda-pov-${Date.now()}.mp4`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }, 100);
  }

  // =========================================================================
  // THREE.JS 3D SCENE & ENGINE
  // =========================================================================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x220c18);
  scene.fog = new THREE.FogExp2(0x280e1c, 0.0028);

  const camera = new THREE.PerspectiveCamera(65, 1080 / 1920, 0.1, 1600);
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
  renderer.setSize(1080, 1920);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  document.getElementById('webglCanvas').appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x4a2432, 1.4);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xff7a33, 3.6);
  sunLight.position.set(-120, 50, -240);
  scene.add(sunLight);

  const skyFillLight = new THREE.DirectionalLight(0x7c3aed, 1.2);
  skyFillLight.position.set(90, 110, 60);
  scene.add(skyFillLight);

  const flashLight = new THREE.PointLight(0x38bdf8, 0, 700);
  flashLight.position.set(0, 40, -100);
  scene.add(flashLight);

  // Terrain
  const terrainGeo = new THREE.PlaneGeometry(1100, 1100, 64, 64);
  terrainGeo.rotateX(-Math.PI / 2);
  const pos = terrainGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    let y = Math.sin(x * 0.012) * Math.cos(z * 0.012) * 14;
    if (Math.abs(x) > 140 || z < -160) y += Math.sin(x * 0.025) * 45 + Math.cos(z * 0.025) * 55;
    pos.setY(i, y);
  }
  terrainGeo.computeVertexNormals();

  const terrainMat = new THREE.MeshStandardMaterial({ color: 0x3a221a, roughness: 0.85, metalness: 0.15, flatShading: true });
  const terrain = new THREE.Mesh(terrainGeo, terrainMat);
  scene.add(terrain);

  // Spectral Bifrost Rainbow Beam
  const rainbowGeo = new THREE.CylinderGeometry(14, 14, 460, 32, 1, true);
  const rainbowShaderMat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, opacity: { value: 0.0 } },
    vertexShader: `varying vec2 vUv; varying vec3 vNormal; void main() { vUv = uv; vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float time; uniform float opacity; varying vec2 vUv; varying vec3 vNormal; vec3 spectralColor(float t) { return vec3(0.5) + vec3(0.5) * cos(6.28318 * (vec3(1.0) * t + vec3(0.0, 0.33, 0.67))); } void main() { float angle = atan(vNormal.x, vNormal.z); float spiral = angle / 6.28318 + vUv.y * 3.0 - time * 1.5; vec3 color = spectralColor(fract(spiral)); float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 1.5); gl_FragColor = vec4(color + vec3(0.2), (fresnel * 0.8 + 0.2) * opacity); }`,
    transparent: true, side: THREE.DoubleSide, depthWrite: false
  });
  const rainbowBeam = new THREE.Mesh(rainbowGeo, rainbowShaderMat);
  rainbowBeam.position.set(0, 230, -80);
  scene.add(rainbowBeam);

  // Wakandan Army Formation
  const armyGroup = new THREE.Group();
  const armyList = [];
  const sharedChestGeo = new THREE.CylinderGeometry(1.3, 0.95, 3.4, 8);
  const sharedArmorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.85, roughness: 0.25 });
  const sharedHeadGeo = new THREE.SphereGeometry(0.8, 10, 10);
  const sharedSkinMat = new THREE.MeshStandardMaterial({ color: 0x3d251e, roughness: 0.6 });

  for (let row = 0; row < 4; row++) {
    for (let col = -5; col <= 5; col++) {
      if (row === 0 && Math.abs(col) <= 1) continue;
      const s = new THREE.Group();
      const body = new THREE.Mesh(sharedChestGeo, sharedArmorMat);
      body.position.y = 3.6;
      const head = new THREE.Mesh(sharedHeadGeo, sharedSkinMat);
      head.position.y = 6.0;
      s.add(body, head);
      s.position.set(col * 8.5, 0, -row * 11 - 8);
      armyGroup.add(s);
      armyList.push(s);
    }
  }
  scene.add(armyGroup);

  // First-Person Arms
  const povArms = new THREE.Group();
  const mySpearGeo = new THREE.CylinderGeometry(0.09, 0.09, 9.5, 8);
  const mySpearMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.9, roughness: 0.1 });
  const mySpear = new THREE.Mesh(mySpearGeo, mySpearMat);
  mySpear.position.set(1.9, -0.2, -2.5);
  mySpear.rotation.x = -1.25;
  povArms.add(mySpear);
  camera.add(povArms);
  scene.add(camera);

  // Outrider Horde
  const outriderCount = 160;
  const outriderGeo = new THREE.ConeGeometry(1.9, 6.0, 5);
  outriderGeo.rotateX(Math.PI / 2);
  const beastMat = new THREE.MeshStandardMaterial({ color: 0x14050a, emissive: 0xe11d48, emissiveIntensity: 0.45, roughness: 0.4 });
  const outriderHorde = new THREE.InstancedMesh(outriderGeo, beastMat, outriderCount);
  const beastDummy = new THREE.Object3D();
  const outriderData = [];
  for (let i = 0; i < outriderCount; i++) {
    const x = (Math.random() - 0.5) * 240;
    const z = -160 - Math.random() * 260;
    outriderData.push({ x, z, speed: 0.24 + Math.random() * 0.22, dead: false });
    beastDummy.position.set(x, 3.0, z);
    beastDummy.updateMatrix();
    outriderHorde.setMatrixAt(i, beastDummy.matrix);
  }
  scene.add(outriderHorde);

  // Ash Particles
  const ashCount = 800;
  const ashGeo = new THREE.BufferGeometry();
  const ashPositions = new Float32Array(ashCount * 3);
  for (let i = 0; i < ashCount * 3; i += 3) {
    ashPositions[i] = (Math.random() - 0.5) * 180;
    ashPositions[i + 1] = Math.random() * 90;
    ashPositions[i + 2] = -20 - Math.random() * 180;
  }
  ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPositions, 3));
  const ashMat = new THREE.PointsMaterial({ color: 0xfbbf24, size: 2.2, transparent: true, opacity: 0 });
  const ashCloud = new THREE.Points(ashGeo, ashMat);
  scene.add(ashCloud);

  // Subtitle Engine
  function showSubtitle(words, highlights = {}) {
    const box = document.getElementById("captionTarget");
    box.innerHTML = "";
    const els = [];
    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "cap-word " + (highlights[i] || "");
      span.textContent = w;
      box.appendChild(span);
      els.push(span);
    });
    return gsap.to(els, { opacity: 1, scale: 1, y: 0, stagger: 0.16, duration: 0.32, ease: "back.out(1.8)" });
  }

  // Animation Timeline
  const master = gsap.timeline({ repeat: -1 });
  master.call(() => {
    camera.position.set(0, 4.5, 4);
    camera.lookAt(0, 4.5, -100);
    povArms.visible = true;
    document.getElementById("tacticalHud").style.opacity = "1";
  })
  .call(() => showSubtitle(["THE", "DOME", "JUST", "SHATTERED."], { 1: "highlight-red", 3: "highlight-red" }))
  .to(camera.position, { z: -10, duration: 4.5, ease: "power1.inOut" })
  .call(() => showSubtitle(["MILLIONS", "ARE", "RUSHING", "STRAIGHT", "AT", "YOU."], { 0: "highlight-gold" }), null, "+=2.0")
  .to("#stage", { x: "+=12", y: "-=12", duration: 0.06, repeat: 16, yoyo: true }, "+=0.4")
  .to(camera.position, { z: -25, duration: 3.5, ease: "power1.out" })

  // Scene 2: Drone Bifrost
  .call(() => {
    povArms.visible = false;
    document.getElementById("tacticalHud").style.opacity = "0";
    gsap.to(camera.position, { x: 60, y: 85, z: 90, duration: 3.0, ease: "power2.out" });
  })
  .call(() => showSubtitle(["YOU", "PREPARE", "FOR", "THE", "END..."]))
  .to(rainbowShaderMat.uniforms.opacity, { value: 0.95, duration: 0.35 }, "+=2.2")
  .to(flashLight, { intensity: 12, duration: 0.15, yoyo: true, repeat: 1 }, "<")
  .to("#flash", { opacity: 0.85, duration: 0.12, yoyo: true, repeat: 1 }, "<")
  .call(() => showSubtitle(["UNTIL", "A", "RAINBOW", "BEAM", "TEARS", "THE", "SKY!"], { 2: "highlight-cyan", 6: "highlight-neon" }))
  .to(rainbowShaderMat.uniforms.opacity, { value: 0.0, duration: 1.2 }, "+=2.8")

  // Scene 3: Thor Lightning
  .call(() => {
    povArms.visible = true;
    document.getElementById("tacticalHud").style.opacity = "1";
    camera.position.set(0, 4.5, -45);
    camera.lookAt(0, 4.5, -120);
  })
  .call(() => showSubtitle(["THOR", "LANDS.", "LIGHTNING", "OBLITERATES", "THEM."], { 0: "highlight-gold", 2: "highlight-cyan" }))
  .to(flashLight, { intensity: 14, color: 0x38bdf8, duration: 0.1, repeat: 7, yoyo: true })
  .to("#flash", { opacity: 0.9, duration: 0.08, repeat: 4, yoyo: true }, "<")
  .to("#stage", { x: "+=16", y: "-=16", duration: 0.04, repeat: 14, yoyo: true }, "<")
  .call(() => { outriderData.forEach(d => d.dead = true); })
  .call(() => showSubtitle(["YOU", "ACTUALLY", "SURVIVED."], { 2: "highlight-neon" }), null, "+=2.8")

  // Scene 4: Snap Dust
  .call(() => {
    povArms.visible = false;
    document.getElementById("tacticalHud").style.opacity = "0";
    gsap.to(camera.position, { x: -45, y: 40, z: 30, duration: 5.0, ease: "power1.inOut" });
  })
  .call(() => showSubtitle(["THEN...", "A", "SUDDEN", "SNAP", "ECHOES."], { 3: "highlight-red" }))
  .to("#flash", { opacity: 0.55, duration: 0.18, yoyo: true, repeat: 1 }, "+=1.0")
  .to(ashMat, { opacity: 0.95, duration: 2.2 }, "<")
  .call(() => showSubtitle(["EVERYONE", "TURNS", "TO", "DUST."], { 3: "highlight-gold" }), null, "+=1.2")
  .to(ashMat, { opacity: 0, duration: 1.8 }, "+=2.8")
  .call(() => { outriderData.forEach(d => { d.dead = false; d.z = -160 - Math.random() * 240; }); });

  // Render Loop
  const _target = new THREE.Vector3(0, 4, -100);
  function animate() {
    requestAnimationFrame(animate);
    const now = Date.now();
    rainbowShaderMat.uniforms.time.value = now * 0.001;

    armyList.forEach((s, idx) => { s.rotation.y = Math.sin(now * 0.0025 + idx) * 0.08; });
    mySpear.position.y = -0.2 + Math.sin(now * 0.0035) * 0.05;

    for (let i = 0; i < outriderCount; i++) {
      const data = outriderData[i];
      if (!data.dead) { data.z += data.speed; if (data.z > 30) data.z = -260; }
      beastDummy.position.set(data.x, 3.0, data.z);
      beastDummy.updateMatrix();
      outriderHorde.setMatrixAt(i, beastDummy.matrix);
    }
    outriderHorde.instanceMatrix.needsUpdate = true;

    camera.lookAt(_target);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
