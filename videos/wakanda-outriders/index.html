<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU POV: Wakanda - Pre-Rendered Media Cutout Style</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020306;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
    }

    #viewport {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: radial-gradient(circle at 50% 35%, #182030 0%, #090e18 60%, #020408 100%);
      overflow: hidden;
      box-shadow: 0 0 140px rgba(0, 0, 0, 0.95);
    }

    /* Subtle Cinematic Overlay Grid & Vignette */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.06) 1.5px, transparent 1.5px),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px, 80px 80px, 80px 80px;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 35%, rgba(0, 0, 0, 0.85) 100%);
      pointer-events: none;
      z-index: 60;
    }

    /* Top HUD Status Pill (Timswissen Style) */
    .hud-header {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(24px) saturate(180%);
      padding: 18px 46px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      z-index: 70;
    }
    .hud-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 18px #ef4444;
    }
    .hud-header span {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #f8fafc;
    }

    /* Central 3D Floating Neumorphic Display Card */
    .stage-card {
      position: absolute;
      top: 300px;
      left: 70px;
      right: 70px;
      height: 1080px;
      border-radius: 52px;
      background: linear-gradient(165deg, rgba(28, 38, 62, 0.8) 0%, rgba(10, 16, 28, 0.95) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      box-shadow: 
        0 40px 100px rgba(0, 0, 0, 0.85),
        inset 0 1px 2px rgba(255, 255, 255, 0.25),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      z-index: 20;
    }

    .scene-viewport {
      position: absolute;
      inset: 0;
      opacity: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Real Cinematic Media Layer (Cutout / Video / Image) */
    .media-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 52px;
      filter: contrast(1.1) brightness(0.95);
      transform-origin: center center;
    }

    /* 3D Floating Cutout Image Frame */
    .cutout-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .cutout-img {
      width: 90%;
      height: 82%;
      object-fit: cover;
      border-radius: 36px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 60px rgba(0,0,0,0.85);
      transform: scale(0.95);
    }

    /* Laser / Lighting Compositing Effects */
    .fx-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    /* Kinetic Subtitles (Timswissen / TikTok Style) */
    .caption-container {
      position: absolute;
      bottom: 200px;
      left: 60px;
      right: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 80;
      min-height: 180px;
    }
    .caption-pill {
      background: rgba(10, 15, 28, 0.92);
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(28px);
      padding: 30px 52px;
      border-radius: 42px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9);
      text-align: center;
    }
    .cap-word {
      display: inline-block;
      font-family: 'Cabinet Grotesk', sans-serif;
      font-size: 58px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      line-height: 1.15;
      color: #ffffff;
      margin: 0 10px;
      opacity: 0;
      transform: translateY(24px) scale(0.75);
      filter: blur(8px);
    }
    .cap-word.highlight-neon {
      color: #22c55e;
      text-shadow: 0 0 35px rgba(34, 197, 94, 0.8), 0 0 10px rgba(34, 197, 94, 0.5);
    }
    .cap-word.highlight-gold {
      color: #fbbf24;
      text-shadow: 0 0 35px rgba(251, 191, 36, 0.8), 0 0 10px rgba(251, 191, 36, 0.5);
    }
    .cap-word.highlight-cyan {
      color: #38bdf8;
      text-shadow: 0 0 35px rgba(56, 189, 248, 0.8), 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .cap-word.highlight-crimson {
      color: #ef4444;
      text-shadow: 0 0 35px rgba(239, 68, 68, 0.8), 0 0 10px rgba(239, 68, 68, 0.5);
    }

    #flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

<div id="viewport">
  <div class="bg-grid"></div>

  <!-- Top Status Pill -->
  <div class="hud-header">
    <div class="hud-dot" id="hudDot"></div>
    <span id="hudLabel">MCU POV • WAKANDA BORDER</span>
  </div>

  <!-- Central Neumorphic Card with Embedded Real Media -->
  <div class="stage-card" id="stageCard">
    
    <!-- Scene 1: Real Wakanda Army Stand (Pre-rendered asset / video) -->
    <div class="scene-viewport" id="scene1">
      <div class="cutout-wrapper">
        <img class="cutout-img" id="imgScene1" src="https://images.unsplash.com/photo-1578632767115-351597cf2477?w=1200&auto=format&fit=crop&q=80" alt="Wakanda Front Lines">
      </div>
    </div>

    <!-- Scene 2: Bifrost Atmospheric Tear -->
    <div class="scene-viewport" id="scene2">
      <div class="cutout-wrapper">
        <img class="cutout-img" id="imgScene2" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200&auto=format&fit=crop&q=80" alt="Bifrost Atmospheric Tear">
        <svg class="fx-overlay" viewBox="0 0 940 1080">
          <defs>
            <linearGradient id="bifrostGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ec4899" stop-opacity="0.9"/>
              <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.95"/>
              <stop offset="60%" stop-color="#38bdf8" stop-opacity="1"/>
              <stop offset="100%" stop-color="#22c55e" stop-opacity="0.9"/>
            </linearGradient>
            <filter id="laserGlow">
              <feGaussianBlur stdDeviation="25" result="glow"/>
              <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <rect id="bifrostLaser" x="380" y="0" width="180" height="1080" fill="url(#bifrostGrad)" filter="url(#laserGlow)" opacity="0"/>
        </svg>
      </div>
    </div>

    <!-- Scene 3: Thor Lightning Obliteration -->
    <div class="scene-viewport" id="scene3">
      <div class="cutout-wrapper">
        <img class="cutout-img" id="imgScene3" src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1200&auto=format&fit=crop&q=80" alt="Thor Lightning">
        <svg class="fx-overlay" viewBox="0 0 940 1080">
          <defs>
            <filter id="lightningFx">
              <feGaussianBlur stdDeviation="15" result="glow"/>
              <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <g id="electricBolts" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#lightningFx)" opacity="0">
            <path d="M470,300 L320,180 L200,260 L80,120"/>
            <path d="M470,300 L620,180 L740,280 L880,140"/>
            <path d="M470,300 L340,650 L180,720 L80,920"/>
            <path d="M470,300 L600,650 L760,720 L860,920"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- Scene 4: The Snap & Disintegration Dust -->
    <div class="scene-viewport" id="scene4">
      <div class="cutout-wrapper">
        <img class="cutout-img" id="imgScene4" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200&auto=format&fit=crop&q=80" alt="The Snap Disintegration" style="filter: grayscale(0.8) contrast(1.2);">
        <svg class="fx-overlay" viewBox="0 0 940 1080">
          <g id="ashField"></g>
        </svg>
      </div>
    </div>

  </div>

  <!-- Subtitle Container -->
  <div class="caption-container">
    <div class="caption-pill" id="subtitleBox"></div>
  </div>

  <div id="flash"></div>
  <div class="vignette"></div>
</div>

<script>
  // Generate 120 Disintegration Ash Particles for Scene 4
  const ashGroup = document.getElementById("ashField");
  for (let i = 0; i < 120; i++) {
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", 280 + Math.random() * 380);
    c.setAttribute("cy", 380 + Math.random() * 320);
    c.setAttribute("r", Math.random() * 5 + 2);
    c.setAttribute("fill", Math.random() > 0.4 ? "#f59e0b" : "#e2e8f0");
    c.setAttribute("class", "ash-particle");
    c.setAttribute("opacity", "0");
    ashGroup.appendChild(c);
  }

  // Word-by-Word Kinetic Subtitle Helper
  function playSubtitle(words, highlightMap = {}) {
    const container = document.getElementById("subtitleBox");
    container.innerHTML = "";
    const els = [];

    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "cap-word " + (highlightMap[i] || "");
      span.textContent = w;
      container.appendChild(span);
      els.push(span);
    });

    return gsap.to(els, {
      opacity: 1,
      y: 0,
      scale: 1,
      filter: "blur(0px)",
      stagger: 0.12,
      duration: 0.28,
      ease: "power3.out"
    });
  }

  // Master GSAP Timeline
  const master = gsap.timeline({ repeat: -1 });

  // SCENE 1: The Shattered Barrier (0:00 - 0:07)
  master.set("#scene1", { opacity: 1 })
    .call(() => playSubtitle(["THE", "DOME", "JUST", "SHATTERED."], { 1: "highlight-crimson", 3: "highlight-crimson" }))
    .fromTo("#imgScene1", 
      { scale: 1.15, filter: "contrast(1.2) brightness(0.6)" }, 
      { scale: 0.98, filter: "contrast(1.1) brightness(0.95)", duration: 2.2, ease: "power2.out" })
    .call(() => playSubtitle(["MILLIONS", "ARE", "CHARGING", "AT", "YOU."], { 0: "highlight-gold" }), null, "+=1.4")
    .to("#scene1", { opacity: 0, duration: 0.4 }, "+=1.6")

  // SCENE 2: The Bifrost Tear (0:07 - 0:14)
  master.set("#scene2", { opacity: 1 })
    .set("#hudDot", { background: "#38bdf8", boxShadow: "0 0 18px #38bdf8" })
    .set("#hudLabel", { textContent: "ANOMALY • RAINBOW BEAM" })
    .call(() => playSubtitle(["YOU", "PREPARE", "FOR", "THE", "END..."]))
    .fromTo("#imgScene2", { scale: 1.1 }, { scale: 0.98, duration: 1.8, ease: "power2.out" })
    .call(() => playSubtitle(["UNTIL", "A", "RAINBOW", "BEAM", "STRIKES!"], { 2: "highlight-cyan", 4: "highlight-neon" }))
    .to("#bifrostLaser", { opacity: 1, duration: 0.12, ease: "power4.out" })
    .to("#flash", { opacity: 0.85, duration: 0.1, yoyo: true, repeat: 1 }, "<")
    .to("#scene2", { opacity: 0, duration: 0.4 }, "+=2.0")

  // SCENE 3: Thor Lightning Blitz (0:14 - 0:21)
  master.set("#scene3", { opacity: 1 })
    .set("#hudDot", { background: "#22c55e", boxShadow: "0 0 18px #22c55e" })
    .set("#hudLabel", { textContent: "ALLIES ARRIVED • THOR" })
    .call(() => playSubtitle(["THOR", "LANDS.", "LIGHTNING", "ERASES", "THEM."], { 0: "highlight-gold", 2: "highlight-cyan" }))
    .fromTo("#imgScene3", { scale: 1.2 }, { scale: 0.98, duration: 2.0, ease: "power2.out" })
    .to("#flash", { opacity: 0.9, duration: 0.08, repeat: 3, yoyo: true }, "<")
    .to("#electricBolts", { opacity: 1, duration: 0.1, repeat: 6, yoyo: true }, "<")
    .to("#stageCard", { x: "+=16", y: "-=16", duration: 0.05, repeat: 8, yoyo: true }, "<")
    .call(() => playSubtitle(["YOU", "ACTUALLY", "SURVIVED."], { 2: "highlight-neon" }), null, "+=1.8")
    .to("#scene3", { opacity: 0, duration: 0.4 }, "+=1.6")

  // SCENE 4: The Snap & Disintegration (0:21 - 0:28)
  master.set("#scene4", { opacity: 1 })
    .set("#hudDot", { background: "#fbbf24", boxShadow: "0 0 18px #fbbf24" })
    .set("#hudLabel", { textContent: "CASUALTIES • THE SNAP" })
    .call(() => playSubtitle(["THEN...", "A", "SUDDEN", "SNAP", "ECHOES."], { 3: "highlight-crimson" }))
    .to("#flash", { opacity: 0.6, duration: 0.15, yoyo: true, repeat: 1 })
    .to("#imgScene4", { filter: "grayscale(1) brightness(0.4)", duration: 1.5 }, "+=0.4")
    .call(() => playSubtitle(["EVERYONE", "TURNS", "TO", "DUST."], { 3: "highlight-gold" }), null, "+=0.6")
    .to(".ash-particle", {
      opacity: 1,
      y: -280,
      x: () => (Math.random() - 0.5) * 160,
      stagger: 0.015,
      duration: 2.4,
      ease: "power2.out"
    })
    .to("#scene4", { opacity: 0, duration: 0.6 }, "+=1.4");
</script>
</body>
</html>
