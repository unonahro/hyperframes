<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU POV: Wakanda Frontline - Live-Action Canvas</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 120px rgba(0, 0, 0, 1);
    }

    /* Cinematic Film Noise & Vignette Overlays */
    .film-grain {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 50;
    }
    .cinematic-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(0, 0, 0, 0.9) 100%);
      pointer-events: none;
      z-index: 45;
    }

    /* Scene Video Containers */
    .scene-clip {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      overflow: hidden;
      background-size: cover;
      background-position: center;
    }

    /* High-Res Cinematic MCU Atmosphere Backdrops */
    #clip1 {
      background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1600&auto=format&fit=crop&q=80');
      filter: contrast(1.25) saturate(1.2) brightness(0.75);
    }
    #clip2 {
      background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600&auto=format&fit=crop&q=80');
      filter: contrast(1.3) saturate(1.4) brightness(0.85);
    }
    #clip3 {
      background-image: url('https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=1600&auto=format&fit=crop&q=80');
      filter: contrast(1.4) saturate(1.3) brightness(0.9);
    }
    #clip4 {
      background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1600&auto=format&fit=crop&q=80');
      filter: grayscale(1) contrast(1.4) brightness(0.5);
    }

    /* Top Floating TikTok POV Header */
    .pov-badge {
      position: absolute;
      top: 140px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      border: 2px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      padding: 16px 42px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
      z-index: 60;
    }
    .live-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 16px #ef4444;
      animation: pulseDot 1s infinite alternate;
    }
    .pov-badge span {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
    }

    /* Professional Kinetic TikTok Subtitles */
    .caption-box {
      position: absolute;
      bottom: 240px;
      left: 50px;
      right: 50px;
      text-align: center;
      z-index: 60;
      min-height: 220px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .caption-pill {
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(25px);
      padding: 32px 48px;
      border-radius: 38px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.95);
      display: inline-block;
    }
    .cap-word {
      display: inline-block;
      font-size: 64px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.15;
      letter-spacing: -1.5px;
      color: #ffffff;
      margin: 0 10px;
      opacity: 0;
      transform: scale(0.6) translateY(24px);
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.9);
    }
    .cap-word.highlight-neon {
      color: #22c55e;
      text-shadow: 0 0 35px rgba(34, 197, 94, 0.9), 0 0 12px rgba(34, 197, 94, 0.6);
    }
    .cap-word.highlight-gold {
      color: #facc15;
      text-shadow: 0 0 35px rgba(250, 204, 21, 0.9), 0 0 12px rgba(250, 204, 21, 0.6);
    }
    .cap-word.highlight-cyan {
      color: #00f2fe;
      text-shadow: 0 0 35px rgba(0, 242, 254, 0.9), 0 0 12px rgba(0, 242, 254, 0.6);
    }
    .cap-word.highlight-red {
      color: #ef4444;
      text-shadow: 0 0 35px rgba(239, 68, 68, 0.9), 0 0 12px rgba(239, 68, 68, 0.6);
    }

    /* Screen Impacts */
    #screenFlash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 90;
    }

    /* Ash Disintegration Particles */
    #ashCanvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
    }

    @keyframes pulseDot {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>

<div id="stage">
  <!-- Scene 1: The Wakanda Frontlines & Breach -->
  <div class="scene-clip" id="clip1"></div>

  <!-- Scene 2: The Bifrost Beam Tears Open the Sky -->
  <div class="scene-clip" id="clip2"></div>

  <!-- Scene 3: Thor Lightning Blitz -->
  <div class="scene-clip" id="clip3"></div>

  <!-- Scene 4: The Snap & Disintegration -->
  <div class="scene-clip" id="clip4">
    <svg id="ashCanvas" viewBox="0 0 1080 1920"></svg>
  </div>

  <!-- Top Badge -->
  <div class="pov-badge">
    <div class="live-dot" id="liveDot"></div>
    <span id="badgeLabel">POV: WAKANDA WARRIOR</span>
  </div>

  <!-- TikTok Animated Captions -->
  <div class="caption-box">
    <div class="caption-pill" id="captionTarget"></div>
  </div>

  <div id="screenFlash"></div>
  <div class="cinematic-vignette"></div>
  <div class="film-grain"></div>
</div>

<script>
  // Setup Snap Ash Particle System
  const ashSvg = document.getElementById("ashCanvas");
  for (let i = 0; i < 140; i++) {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    p.setAttribute("cx", Math.random() * 1080);
    p.setAttribute("cy", 800 + Math.random() * 900);
    p.setAttribute("r", Math.random() * 7 + 2);
    p.setAttribute("fill", Math.random() > 0.4 ? "#f59e0b" : "#cbd5e1");
    p.setAttribute("class", "dust-part");
    p.setAttribute("opacity", "0");
    ashSvg.appendChild(p);
  }

  // Word-by-Word Kinetic Subtitle Engine
  function showSubtitle(words, highlights = {}) {
    const box = document.getElementById("captionTarget");
    box.innerHTML = "";
    const els = [];

    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "cap-word " + (highlights[i] || "");
      span.textContent = w;
      box.appendChild(span);
      els.push(span);
    });

    return gsap.to(els, {
      opacity: 1,
      scale: 1,
      y: 0,
      stagger: 0.11,
      duration: 0.24,
      ease: "back.out(2.2)"
    });
  }

  // Master Cinematic Timeline
  const tl = gsap.timeline({ repeat: -1 });

  // SCENE 1: The Dome Shatters (0:00 - 0:07)
  tl.set("#clip1", { opacity: 1 })
    .call(() => showSubtitle(["THE", "DOME", "JUST", "SHATTERED."], { 1: "highlight-red", 3: "highlight-red" }))
    .fromTo("#clip1", { scale: 1.18 }, { scale: 1.02, duration: 2.2, ease: "power2.out" })
    .call(() => showSubtitle(["MILLIONS", "ARE", "CHARGING", "AT", "YOU."], { 0: "highlight-gold" }), null, "+=1.2")
    .to("#clip1", { opacity: 0, duration: 0.3 }, "+=1.8")

  // SCENE 2: The Bifrost Strike (0:07 - 0:14)
  tl.set("#clip2", { opacity: 1 })
    .set("#liveDot", { background: "#00f2fe", boxShadow: "0 0 16px #00f2fe" })
    .set("#badgeLabel", { textContent: "ANOMALY: ATMOSPHERIC TEAR" })
    .call(() => showSubtitle(["YOU", "PREPARE", "FOR", "THE", "END..."]))
    .fromTo("#clip2", { scale: 1.15 }, { scale: 1.0, duration: 1.8, ease: "power2.out" })
    .call(() => showSubtitle(["UNTIL", "A", "RAINBOW", "BEAM", "STRIKES!"], { 2: "highlight-cyan", 4: "highlight-neon" }))
    .to("#screenFlash", { opacity: 0.85, duration: 0.08, repeat: 1, yoyo: true })
    .to("#clip2", { opacity: 0, duration: 0.3 }, "+=2.0")

  // SCENE 3: Thor Lightning Wave (0:14 - 0:21)
  tl.set("#clip3", { opacity: 1 })
    .set("#liveDot", { background: "#22c55e", boxShadow: "0 0 16px #22c55e" })
    .set("#badgeLabel", { textContent: "ALLIES ARRIVED: THOR" })
    .call(() => showSubtitle(["THOR", "LANDS.", "LIGHTNING", "ERASES", "THEM."], { 0: "highlight-gold", 2: "highlight-cyan" }))
    .fromTo("#clip3", { scale: 1.2 }, { scale: 1.0, duration: 2.0, ease: "power2.out" })
    .to("#screenFlash", { opacity: 0.9, duration: 0.06, repeat: 3, yoyo: true }, "<")
    .to("#stage", { x: "+=18", y: "-=18", duration: 0.04, repeat: 10, yoyo: true }, "<")
    .call(() => showSubtitle(["YOU", "ACTUALLY", "SURVIVED."], { 2: "highlight-neon" }), null, "+=1.8")
    .to("#clip3", { opacity: 0, duration: 0.3 }, "+=1.6")

  // SCENE 4: The Snap & Disintegration (0:21 - 0:28)
  tl.set("#clip4", { opacity: 1 })
    .set("#liveDot", { background: "#eab308", boxShadow: "0 0 16px #eab308" })
    .set("#badgeLabel", { textContent: "CASUALTIES: THE SNAP" })
    .call(() => showSubtitle(["THEN...", "A", "SUDDEN", "SNAP", "ECHOES."], { 3: "highlight-red" }))
    .to("#screenFlash", { opacity: 0.6, duration: 0.12, yoyo: true, repeat: 1 }, "+=0.6")
    .call(() => showSubtitle(["EVERYONE", "TURNS", "TO", "DUST."], { 3: "highlight-gold" }), null, "+=0.8")
    .to(".dust-part", {
      opacity: 1,
      y: -400,
      x: () => (Math.random() - 0.5) * 200,
      stagger: 0.012,
      duration: 2.6,
      ease: "power2.out"
    })
    .to("#clip4", { opacity: 0, duration: 0.6 }, "+=1.4");
</script>
</body>
</html>
