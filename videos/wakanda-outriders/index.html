<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU POV: Wakanda 3D Battle Simulator (Three.js WebGL)</title>
  <!-- Three.js 3D Engine & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #020408;
      overflow: hidden;
      box-shadow: 0 0 140px rgba(0, 0, 0, 1);
    }

    /* 3D WebGL Canvas Layer */
    #webglCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Atmospheric Vignette & Film Filter */
    .cinematic-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(2, 4, 10, 0.85) 100%);
      pointer-events: none;
      z-index: 20;
    }

    /* Top HUD / POV Badge */
    .pov-badge {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 25, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(20px);
      padding: 16px 44px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      z-index: 30;
    }
    .hud-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 16px #ef4444;
      animation: pulse 1s infinite alternate;
    }
    .pov-badge span {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
    }

    /* TikTok Subtitles */
    .caption-box {
      position: absolute;
      bottom: 220px;
      left: 60px;
      right: 60px;
      text-align: center;
      z-index: 30;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .caption-pill {
      background: rgba(8, 12, 22, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(28px);
      padding: 30px 48px;
      border-radius: 38px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.95);
      display: inline-block;
    }
    .cap-word {
      display: inline-block;
      font-size: 60px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.15;
      letter-spacing: -1.5px;
      color: #ffffff;
      margin: 0 10px;
      opacity: 0;
      transform: scale(0.6) translateY(24px);
    }
    .cap-word.highlight-neon {
      color: #22c55e;
      text-shadow: 0 0 35px rgba(34, 197, 94, 0.9), 0 0 10px rgba(34, 197, 94, 0.6);
    }
    .cap-word.highlight-gold {
      color: #facc15;
      text-shadow: 0 0 35px rgba(250, 204, 21, 0.9), 0 0 10px rgba(250, 204, 21, 0.6);
    }
    .cap-word.highlight-cyan {
      color: #00f2fe;
      text-shadow: 0 0 35px rgba(0, 242, 254, 0.9), 0 0 10px rgba(0, 242, 254, 0.6);
    }
    .cap-word.highlight-red {
      color: #ef4444;
      text-shadow: 0 0 35px rgba(239, 68, 68, 0.9), 0 0 10px rgba(239, 68, 68, 0.6);
    }

    #flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>

<div id="stage">
  <div id="webglCanvas"></div>

  <!-- HUD Badge -->
  <div class="pov-badge">
    <div class="hud-dot" id="hudDot"></div>
    <span id="hudLabel">3D POV • WAKANDA FRONTLINE</span>
  </div>

  <!-- TikTok Subtitles -->
  <div class="caption-box">
    <div class="caption-pill" id="captionTarget"></div>
  </div>

  <div id="flash"></div>
  <div class="cinematic-vignette"></div>
</div>

<script>
  // -------------------------------------------------------------
  // 1. THREE.JS 3D WORLD SETUP
  // -------------------------------------------------------------
  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x060c18, 0.0035);

  const camera = new THREE.PerspectiveCamera(65, 1080 / 1920, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(1080, 1920);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  document.getElementById('webglCanvas').appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x223344, 1.2);
  scene.add(ambientLight);

  const moonLight = new THREE.DirectionalLight(0x88bbff, 1.8);
  moonLight.position.set(50, 120, -50);
  scene.add(moonLight);

  const flashLight = new THREE.PointLight(0x00f2fe, 0, 400);
  flashLight.position.set(0, 40, -100);
  scene.add(flashLight);

  // 3D Battlefield Terrain (Wakanda Field)
  const terrainGeo = new THREE.PlaneGeometry(800, 800, 48, 48);
  terrainGeo.rotateX(-Math.PI / 2);
  const terrainMat = new THREE.MeshStandardMaterial({
    color: 0x1a2e1f,
    roughness: 0.9,
    metalness: 0.1,
    flatShading: true
  });
  const terrain = new THREE.Mesh(terrainGeo, terrainMat);
  scene.add(terrain);

  // 3D Wakandan Energy Dome Barrier
  const domeGeo = new THREE.SphereGeometry(180, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
  const domeMat = new THREE.MeshBasicMaterial({
    color: 0x00d2ff,
    wireframe: true,
    transparent: true,
    opacity: 0.25
  });
  const dome = new THREE.Mesh(domeGeo, domeMat);
  dome.position.set(0, 0, -120);
  scene.add(dome);

  // 3D Charging Outrider Horde (Instanced Meshes for Performance)
  const outriderCount = 180;
  const outriderGeo = new THREE.ConeGeometry(1.6, 5, 5);
  outriderGeo.rotateX(Math.PI / 2);
  const outriderMat = new THREE.MeshStandardMaterial({
    color: 0x11050a,
    emissive: 0xef4444,
    emissiveIntensity: 0.4,
    roughness: 0.4
  });
  const horde = new THREE.InstancedMesh(outriderGeo, outriderMat, outriderCount);
  const dummy = new THREE.Object3D();

  const outriderData = [];
  for (let i = 0; i < outriderCount; i++) {
    const x = (Math.random() - 0.5) * 160;
    const z = -140 - Math.random() * 200;
    const speed = 0.45 + Math.random() * 0.4;
    outriderData.push({ x, z, speed, dead: false });
    dummy.position.set(x, 2.5, z);
    dummy.updateMatrix();
    horde.setMatrixAt(i, dummy.matrix);
  }
  scene.add(horde);

  // 3D Bifrost Beam (Glowing Cylinder)
  const beamGeo = new THREE.CylinderGeometry(8, 8, 300, 24, 1, true);
  const beamMat = new THREE.MeshBasicMaterial({
    color: 0x00f2fe,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide
  });
  const bifrostBeam = new THREE.Mesh(beamGeo, beamMat);
  bifrostBeam.position.set(0, 150, -60);
  scene.add(bifrostBeam);

  // 3D Disintegration Ash Particle Cloud
  const ashCount = 800;
  const ashGeo = new THREE.BufferGeometry();
  const ashPositions = new Float32Array(ashCount * 3);
  for (let i = 0; i < ashCount * 3; i += 3) {
    ashPositions[i] = (Math.random() - 0.5) * 120;
    ashPositions[i + 1] = Math.random() * 60;
    ashPositions[i + 2] = -20 - Math.random() * 120;
  }
  ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPositions, 3));
  const ashMat = new THREE.PointsMaterial({
    color: 0xf59e0b,
    size: 1.8,
    transparent: true,
    opacity: 0
  });
  const ashCloud = new THREE.Points(ashGeo, ashMat);
  scene.add(ashCloud);

  // -------------------------------------------------------------
  // 2. KINETIC SUBTITLE ENGINE
  // -------------------------------------------------------------
  function showSubtitle(words, highlights = {}) {
    const box = document.getElementById("captionTarget");
    box.innerHTML = "";
    const els = [];

    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "cap-word " + (highlights[i] || "");
      span.textContent = w;
      box.appendChild(span);
      els.push(span);
    });

    return gsap.to(els, {
      opacity: 1,
      scale: 1,
      y: 0,
      stagger: 0.11,
      duration: 0.24,
      ease: "back.out(2.2)"
    });
  }

  // -------------------------------------------------------------
  // 3. CINEMATIC 3D CAMERA TIMELINE (First-Person & Cinematic Wide)
  // -------------------------------------------------------------
  const master = gsap.timeline({ repeat: -1 });

  // SCENE 1: First-Person Frontline Breach (0:00 - 0:07)
  master.call(() => {
    // Camera placed right at warrior eye level (POV)
    camera.position.set(0, 4.5, 0);
    camera.lookAt(0, 4.5, -100);
    domeMat.opacity = 0.35;
    domeMat.color.setHex(0xef4444);
    document.getElementById("hudDot").style.background = "#ef4444";
    document.getElementById("hudLabel").textContent = "1ST PERSON POV • DOME BREACH";
  })
  .call(() => showSubtitle(["THE", "DOME", "JUST", "SHATTERED."], { 1: "highlight-red", 3: "highlight-red" }))
  .to(camera.position, { z: -15, duration: 3, ease: "power1.inOut" })
  .call(() => showSubtitle(["MILLIONS", "ARE", "CHARGING", "AT", "YOU."], { 0: "highlight-gold" }), null, "+=1.2")
  .to("#stage", { x: "+=12", y: "-=12", duration: 0.05, repeat: 12, yoyo: true }, "+=0.2")

  // SCENE 2: Cinematic Drone Shot (Far Away) + Bifrost Strike (0:07 - 0:14)
  .call(() => {
    // Switch to far-away aerial cinematic perspective
    gsap.to(camera.position, { x: 45, y: 70, z: 60, duration: 1.5, ease: "power2.out" });
    document.getElementById("hudDot").style.background = "#00f2fe";
    document.getElementById("hudLabel").textContent = "WIDE PERSPECTIVE • BIFROST TEAR";
  })
  .call(() => showSubtitle(["YOU", "PREPARE", "FOR", "THE", "END..."]))
  .to(bifrostBeam.material, { opacity: 0.9, duration: 0.2, ease: "power4.out" }, "+=1.2")
  .to(flashLight, { intensity: 8, duration: 0.1, yoyo: true, repeat: 1 }, "<")
  .to("#flash", { opacity: 0.85, duration: 0.08, yoyo: true, repeat: 1 }, "<")
  .call(() => showSubtitle(["UNTIL", "A", "RAINBOW", "BEAM", "STRIKES!"], { 2: "highlight-cyan", 4: "highlight-neon" }))
  .to(bifrostBeam.material, { opacity: 0, duration: 0.6 }, "+=1.8")

  // SCENE 3: First-Person Thor Lightning Blitz (0:14 - 0:21)
  .call(() => {
    // Return to close First-Person POV as Thor lands right in front of you
    camera.position.set(0, 4.5, -40);
    camera.lookAt(0, 4.5, -120);
    document.getElementById("hudDot").style.background = "#22c55e";
    document.getElementById("hudLabel").textContent = "1ST PERSON POV • THOR ARRIVAL";
  })
  .call(() => showSubtitle(["THOR", "LANDS.", "LIGHTNING", "ERASES", "THEM."], { 0: "highlight-gold", 2: "highlight-cyan" }))
  .to(flashLight, { intensity: 12, color: 0x38bdf8, duration: 0.08, repeat: 5, yoyo: true })
  .to("#flash", { opacity: 0.9, duration: 0.06, repeat: 3, yoyo: true }, "<")
  .to("#stage", { x: "+=18", y: "-=18", duration: 0.04, repeat: 10, yoyo: true }, "<")
  .call(() => {
    // Wipe out the Outrider army
    outriderData.forEach(d => d.dead = true);
  })
  .call(() => showSubtitle(["YOU", "ACTUALLY", "SURVIVED."], { 2: "highlight-neon" }), null, "+=1.8")

  // SCENE 4: Wide Pan & Snap Disintegration Dust (0:21 - 0:28)
  .call(() => {
    // Cinematic slow camera orbit as everyone turns to ash
    gsap.to(camera.position, { x: -30, y: 35, z: 20, duration: 3.5, ease: "power2.out" });
    document.getElementById("hudDot").style.background = "#f59e0b";
    document.getElementById("hudLabel").textContent = "CINEMATIC WIDE • THE SNAP";
  })
  .call(() => showSubtitle(["THEN...", "A", "SUDDEN", "SNAP", "ECHOES."], { 3: "highlight-red" }))
  .to("#flash", { opacity: 0.5, duration: 0.12, yoyo: true, repeat: 1 }, "+=0.6")
  .to(ashMat, { opacity: 0.95, duration: 1.5 }, "<")
  .call(() => showSubtitle(["EVERYONE", "TURNS", "TO", "DUST."], { 3: "highlight-gold" }), null, "+=0.8")
  .to(ashMat, { opacity: 0, duration: 1.2 }, "+=2.0")
  .call(() => {
    // Reset outriders for seamless loop
    outriderData.forEach(d => { d.dead = false; d.z = -140 - Math.random() * 200; });
  });

  // -------------------------------------------------------------
  // 4. CONTINUOUS RENDER LOOP (60 FPS)
  // -------------------------------------------------------------
  function animate() {
    requestAnimationFrame(animate);

    // Animate Charging Outriders
    for (let i = 0; i < outriderCount; i++) {
      const data = outriderData[i];
      if (!data.dead) {
        data.z += data.speed;
        if (data.z > 20) data.z = -240;
      } else {
        data.z -= 0.2; // Fallback
      }
      dummy.position.set(data.x, 2.5, data.z);
      dummy.rotation.x = Math.sin(Date.now() * 0.01 + i) * 0.2;
      dummy.updateMatrix();
      horde.setMatrixAt(i, dummy.matrix);
    }
    horde.instanceMatrix.needsUpdate = true;

    // Animate Ash Disintegration Particles Rising
    const positions = ashGeo.attributes.position.array;
    for (let i = 1; i < ashCount * 3; i += 3) {
      positions[i] += 0.35;
      if (positions[i] > 80) positions[i] = 0;
    }
    ashGeo.attributes.position.needsUpdate = true;

    camera.lookAt(0, 4, -100);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
