<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCU POV: Wakanda 3D Battle Simulator - Warriors & Outriders</title>
  <!-- Three.js 3D Engine & GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,900;1,900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font-family: 'Montserrat', sans-serif;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      background: #1a0814;
      overflow: hidden;
      box-shadow: 0 0 140px rgba(0, 0, 0, 1);
    }

    #webglCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .cinematic-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, transparent 35%, rgba(18, 5, 12, 0.9) 100%);
      pointer-events: none;
      z-index: 20;
    }

    /* Top HUD / POV Badge */
    .pov-badge {
      position: absolute;
      top: 130px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(28, 12, 22, 0.88);
      border: 2px solid rgba(251, 146, 60, 0.4);
      backdrop-filter: blur(20px);
      padding: 18px 48px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
      z-index: 30;
    }
    .hud-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #f97316;
      box-shadow: 0 0 16px #f97316;
      animation: pulse 1.4s infinite alternate;
    }
    .pov-badge span {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
    }

    /* TikTok Subtitles */
    .caption-box {
      position: absolute;
      bottom: 220px;
      left: 60px;
      right: 60px;
      text-align: center;
      z-index: 30;
      min-height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .caption-pill {
      background: rgba(16, 7, 14, 0.94);
      border: 2px solid rgba(251, 146, 60, 0.35);
      backdrop-filter: blur(28px);
      padding: 32px 52px;
      border-radius: 40px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.95);
      display: inline-block;
    }
    .cap-word {
      display: inline-block;
      font-size: 58px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.18;
      letter-spacing: -1.5px;
      color: #ffffff;
      margin: 0 10px;
      opacity: 0;
      transform: scale(0.6) translateY(24px);
    }
    .cap-word.highlight-neon {
      color: #22c55e;
      text-shadow: 0 0 35px rgba(34, 197, 94, 0.9), 0 0 10px rgba(34, 197, 94, 0.6);
    }
    .cap-word.highlight-gold {
      color: #fbbf24;
      text-shadow: 0 0 35px rgba(251, 191, 36, 0.9), 0 0 10px rgba(251, 191, 36, 0.6);
    }
    .cap-word.highlight-cyan {
      color: #38bdf8;
      text-shadow: 0 0 35px rgba(56, 189, 248, 0.9), 0 0 10px rgba(56, 189, 248, 0.6);
    }
    .cap-word.highlight-red {
      color: #ef4444;
      text-shadow: 0 0 35px rgba(239, 68, 68, 0.9), 0 0 10px rgba(239, 68, 68, 0.6);
    }

    #flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.3); opacity: 1; }
    }
  </style>
</head>
<body>

<div id="stage">
  <div id="webglCanvas"></div>

  <!-- HUD Badge -->
  <div class="pov-badge">
    <div class="hud-dot" id="hudDot"></div>
    <span id="hudLabel">3D POV • WAKANDA BATTLEFIELD</span>
  </div>

  <!-- TikTok Subtitles -->
  <div class="caption-box">
    <div class="caption-pill" id="captionTarget"></div>
  </div>

  <div id="flash"></div>
  <div class="cinematic-vignette"></div>
</div>

<script>
  // -------------------------------------------------------------
  // 1. THREE.JS 3D SCENE SETUP & BATTLEFIELD ENVIRONMENT
  // -------------------------------------------------------------
  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  
  scene.background = new THREE.Color(0x220c18);
  scene.fog = new THREE.FogExp2(0x280e1c, 0.0028);

  const camera = new THREE.PerspectiveCamera(65, 1080 / 1920, 0.1, 1200);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(1080, 1920);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  document.getElementById('webglCanvas').appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0x4a2432, 1.4);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xff7a33, 3.4);
  sunLight.position.set(-100, 45, -220);
  scene.add(sunLight);

  const fillLight = new THREE.DirectionalLight(0x7c3aed, 1.1);
  fillLight.position.set(80, 100, 60);
  scene.add(fillLight);

  const flashLight = new THREE.PointLight(0x38bdf8, 0, 500);
  flashLight.position.set(0, 40, -100);
  scene.add(flashLight);

  // Terrain with Rolling Hills
  const terrainGeo = new THREE.PlaneGeometry(900, 900, 64, 64);
  terrainGeo.rotateX(-Math.PI / 2);
  const pos = terrainGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    let y = Math.sin(x * 0.015) * Math.cos(z * 0.015) * 12;
    if (Math.abs(x) > 160 || z < -180) {
      y += Math.sin(x * 0.03) * 35 + Math.cos(z * 0.03) * 45;
    }
    pos.setY(i, y);
  }
  terrainGeo.computeVertexNormals();

  const terrainMat = new THREE.MeshStandardMaterial({
    color: 0x3d241c,
    roughness: 0.85,
    metalness: 0.15,
    flatShading: true
  });
  const terrain = new THREE.Mesh(terrainGeo, terrainMat);
  scene.add(terrain);

  // -------------------------------------------------------------
  // 2. 3D HUMAN WAKANDAN WARRIORS (ARMY FORMATION)
  // -------------------------------------------------------------
  function createWakandanWarrior() {
    const warrior = new THREE.Group();

    // Torso / Vibranium Armor
    const torsoGeo = new THREE.CylinderGeometry(1.2, 0.9, 3.2, 8);
    const armorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.8, roughness: 0.2 });
    const torso = new THREE.Mesh(torsoGeo, armorMat);
    torso.position.y = 3.6;
    warrior.add(torso);

    // Head
    const headGeo = new THREE.SphereGeometry(0.75, 12, 12);
    const skinMat = new THREE.MeshStandardMaterial({ color: 0x3e2723, roughness: 0.6 });
    const head = new THREE.Mesh(headGeo, skinMat);
    head.position.y = 5.8;
    warrior.add(head);

    // Legs
    const legGeo = new THREE.CylinderGeometry(0.4, 0.35, 2.8, 6);
    const legL = new THREE.Mesh(legGeo, armorMat);
    legL.position.set(-0.55, 1.4, 0);
    const legR = new THREE.Mesh(legGeo, armorMat);
    legR.position.set(0.55, 1.4, 0);
    warrior.add(legL, legR);

    // Vibranium Spear with Glowing Energy Tip
    const spearGeo = new THREE.CylinderGeometry(0.08, 0.08, 8.5, 8);
    const spearMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.9, roughness: 0.1 });
    const spear = new THREE.Mesh(spearGeo, spearMat);
    spear.position.set(1.4, 4.5, -0.6);
    spear.rotation.x = -0.3;

    const tipGeo = new THREE.ConeGeometry(0.28, 1.4, 8);
    const tipMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
    const tip = new THREE.Mesh(tipGeo, tipMat);
    tip.position.y = 4.4;
    spear.add(tip);
    warrior.add(spear);

    // Vibranium Energy Shield (Left Arm)
    const shieldGeo = new THREE.CylinderGeometry(1.4, 1.4, 0.15, 8);
    shieldGeo.rotateX(Math.PI / 2);
    const shieldMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.5, metalness: 0.8 });
    const shield = new THREE.Mesh(shieldGeo, shieldMat);
    shield.position.set(-1.4, 4.0, 0.6);
    warrior.add(shield);

    return warrior;
  }

  // Create an army of 40 Wakandan human warriors standing beside and in front of you
  const warriorGroup = new THREE.Group();
  const warriorList = [];
  for (let row = 0; row < 4; row++) {
    for (let col = -5; col <= 5; col++) {
      if (row === 0 && Math.abs(col) <= 1) continue; // Clear direct center for 1st-person camera
      const w = createWakandanWarrior();
      const x = col * 8 + (Math.random() - 0.5) * 2;
      const z = -row * 10 - 8 + (Math.random() - 0.5) * 3;
      w.position.set(x, 0, z);
      warriorGroup.add(w);
      warriorList.push(w);
    }
  }
  scene.add(warriorGroup);

  // -------------------------------------------------------------
  // 3. FIRST-PERSON POV ARMS & SPEAR (Visible in Player View)
  // -------------------------------------------------------------
  const povArms = new THREE.Group();

  // Right Hand & Vibranium Spear
  const mySpearGeo = new THREE.CylinderGeometry(0.09, 0.09, 9, 8);
  const mySpearMat = new THREE.MeshStandardMaterial({ color: 0xcfd8dc, metalness: 0.9, roughness: 0.1 });
  const mySpear = new THREE.Mesh(mySpearGeo, mySpearMat);
  mySpear.position.set(1.8, -0.2, -2.4);
  mySpear.rotation.x = -1.25;
  mySpear.rotation.z = -0.2;

  const myTipGeo = new THREE.ConeGeometry(0.32, 1.6, 8);
  const myTipMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
  const myTip = new THREE.Mesh(myTipGeo, myTipMat);
  myTip.position.y = 4.6;
  mySpear.add(myTip);
  povArms.add(mySpear);

  // Left Arm Vibranium Shield
  const myShieldGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.18, 8);
  myShieldGeo.rotateX(Math.PI / 2);
  const myShieldMat = new THREE.MeshStandardMaterial({ color: 0x0ea5e9, emissive: 0x0284c7, emissiveIntensity: 0.6, metalness: 0.8 });
  const myShield = new THREE.Mesh(myShieldGeo, myShieldMat);
  myShield.position.set(-1.8, -0.6, -2.2);
  myShield.rotation.y = 0.4;
  povArms.add(myShield);

  camera.add(povArms);
  scene.add(camera);

  // -------------------------------------------------------------
  // 4. CHARGING OUTRIDER SWARM & BIFROST
  // -------------------------------------------------------------
  const outriderCount = 180;
  const outriderGeo = new THREE.ConeGeometry(1.8, 5.5, 5);
  outriderGeo.rotateX(Math.PI / 2);
  const outriderMat = new THREE.MeshStandardMaterial({
    color: 0x18060f,
    emissive: 0xe11d48,
    emissiveIntensity: 0.45,
    roughness: 0.4
  });
  const horde = new THREE.InstancedMesh(outriderGeo, outriderMat, outriderCount);
  const dummy = new THREE.Object3D();

  const outriderData = [];
  for (let i = 0; i < outriderCount; i++) {
    const x = (Math.random() - 0.5) * 220;
    const z = -160 - Math.random() * 240;
    const speed = 0.22 + Math.random() * 0.2;
    outriderData.push({ x, z, speed, dead: false });
    dummy.position.set(x, 3.0, z);
    dummy.updateMatrix();
    horde.setMatrixAt(i, dummy.matrix);
  }
  scene.add(horde);

  // Dome Shield
  const domeGeo = new THREE.SphereGeometry(220, 36, 28, 0, Math.PI * 2, 0, Math.PI / 2);
  const domeMat = new THREE.MeshBasicMaterial({
    color: 0xfb923c,
    wireframe: true,
    transparent: true,
    opacity: 0.32
  });
  const dome = new THREE.Mesh(domeGeo, domeMat);
  dome.position.set(0, 0, -140);
  scene.add(dome);

  // Bifrost Beam
  const beamGeo = new THREE.CylinderGeometry(10, 10, 380, 24, 1, true);
  const beamMat = new THREE.MeshBasicMaterial({
    color: 0x38bdf8,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide
  });
  const bifrostBeam = new THREE.Mesh(beamGeo, beamMat);
  bifrostBeam.position.set(0, 190, -80);
  scene.add(bifrostBeam);

  // Disintegration Ash Cloud
  const ashCount = 900;
  const ashGeo = new THREE.BufferGeometry();
  const ashPositions = new Float32Array(ashCount * 3);
  for (let i = 0; i < ashCount * 3; i += 3) {
    ashPositions[i] = (Math.random() - 0.5) * 160;
    ashPositions[i + 1] = Math.random() * 80;
    ashPositions[i + 2] = -20 - Math.random() * 160;
  }
  ashGeo.setAttribute('position', new THREE.BufferAttribute(ashPositions, 3));
  const ashMat = new THREE.PointsMaterial({
    color: 0xfbbf24,
    size: 2.2,
    transparent: true,
    opacity: 0
  });
  const ashCloud = new THREE.Points(ashGeo, ashMat);
  scene.add(ashCloud);

  // -------------------------------------------------------------
  // 5. KINETIC SUBTITLE ENGINE
  // -------------------------------------------------------------
  function showSubtitle(words, highlights = {}) {
    const box = document.getElementById("captionTarget");
    box.innerHTML = "";
    const els = [];

    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "cap-word " + (highlights[i] || "");
      span.textContent = w;
      box.appendChild(span);
      els.push(span);
    });

    return gsap.to(els, {
      opacity: 1,
      scale: 1,
      y: 0,
      stagger: 0.16,
      duration: 0.32,
      ease: "back.out(1.8)"
    });
  }

  // -------------------------------------------------------------
  // 6. CINEMATIC 3D TIMELINE
  // -------------------------------------------------------------
  const master = gsap.timeline({ repeat: -1 });

  // SCENE 1: First-Person Frontline Stand with Army (0:00 - 0:10)
  master.call(() => {
    camera.position.set(0, 4.5, 4);
    camera.lookAt(0, 4.5, -100);
    povArms.visible = true;
    domeMat.opacity = 0.35;
    domeMat.color.setHex(0xe11d48);
    document.getElementById("hudDot").style.background = "#e11d48";
    document.getElementById("hudLabel").textContent = "1ST PERSON POV • DOME BREACH";
  })
  .call(() => showSubtitle(["THE", "DOME", "JUST", "SHATTERED."], { 1: "highlight-red", 3: "highlight-red" }))
  .to(camera.position, { z: -10, duration: 4.5, ease: "power1.inOut" })
  .call(() => showSubtitle(["MILLIONS", "ARE", "RUSHING", "STRAIGHT", "AT", "YOU."], { 0: "highlight-gold" }), null, "+=2.0")
  .to("#stage", { x: "+=10", y: "-=10", duration: 0.06, repeat: 16, yoyo: true }, "+=0.4")
  .to(camera.position, { z: -25, duration: 3.5, ease: "power1.out" })

  // SCENE 2: Cinematic Drone Far-Away Shot + Bifrost Beam (0:10 - 0:20)
  .call(() => {
    povArms.visible = false;
    gsap.to(camera.position, { x: 60, y: 85, z: 90, duration: 3.0, ease: "power2.out" });
    document.getElementById("hudDot").style.background = "#38bdf8";
    document.getElementById("hudLabel").textContent = "AERIAL VIEW • BIFROST TEAR";
  })
  .call(() => showSubtitle(["YOU", "PREPARE", "FOR", "THE", "END..."]))
  .to(bifrostBeam.material, { opacity: 0.95, duration: 0.35, ease: "power4.out" }, "+=2.5")
  .to(flashLight, { intensity: 10, duration: 0.15, yoyo: true, repeat: 1 }, "<")
  .to("#flash", { opacity: 0.85, duration: 0.12, yoyo: true, repeat: 1 }, "<")
  .call(() => showSubtitle(["UNTIL", "A", "RAINBOW", "BEAM", "TEARS", "THE", "SKY!"], { 2: "highlight-cyan", 6: "highlight-neon" }))
  .to(bifrostBeam.material, { opacity: 0, duration: 1.2 }, "+=2.8")

  // SCENE 3: First-Person Thor Lightning Arrival (0:20 - 0:30)
  .call(() => {
    povArms.visible = true;
    camera.position.set(0, 4.5, -45);
    camera.lookAt(0, 4.5, -120);
    document.getElementById("hudDot").style.background = "#22c55e";
    document.getElementById("hudLabel").textContent = "1ST PERSON POV • THOR ARRIVAL";
  })
  .call(() => showSubtitle(["THOR", "LANDS.", "LIGHTNING", "OBLITERATES", "THEM."], { 0: "highlight-gold", 2: "highlight-cyan" }))
  .to(flashLight, { intensity: 14, color: 0x38bdf8, duration: 0.1, repeat: 7, yoyo: true })
  .to("#flash", { opacity: 0.9, duration: 0.08, repeat: 4, yoyo: true }, "<")
  .to("#stage", { x: "+=16", y: "-=16", duration: 0.04, repeat: 14, yoyo: true }, "<")
  .call(() => {
    outriderData.forEach(d => d.dead = true);
  })
  .call(() => showSubtitle(["YOU", "ACTUALLY", "SURVIVED."], { 2: "highlight-neon" }), null, "+=2.8")
  .to(camera.position, { z: -55, duration: 3.0, ease: "power1.out" })

  // SCENE 4: Panoramic Orbit & The Snap Disintegration (0:30 - 0:38)
  .call(() => {
    povArms.visible = false;
    gsap.to(camera.position, { x: -45, y: 40, z: 30, duration: 5.0, ease: "power1.inOut" });
    document.getElementById("hudDot").style.background = "#f59e0b";
    document.getElementById("hudLabel").textContent = "CINEMATIC PAN • THE SNAP";
  })
  .call(() => showSubtitle(["THEN...", "A", "SUDDEN", "SNAP", "ECHOES."], { 3: "highlight-red" }))
  .to("#flash", { opacity: 0.55, duration: 0.18, yoyo: true, repeat: 1 }, "+=1.0")
  .to(ashMat, { opacity: 0.95, duration: 2.2 }, "<")
  .call(() => showSubtitle(["EVERYONE", "TURNS", "TO", "DUST."], { 3: "highlight-gold" }), null, "+=1.2")
  .to(ashMat, { opacity: 0, duration: 1.8 }, "+=2.8")
  .call(() => {
    outriderData.forEach(d => { d.dead = false; d.z = -160 - Math.random() * 240; });
  });

  // -------------------------------------------------------------
  // 7. ANIMATION LOOP
  // -------------------------------------------------------------
  function animate() {
    requestAnimationFrame(animate);

    // Warriors Combat Idle & Spear Stances
    warriorList.forEach((w, idx) => {
      w.rotation.y = Math.sin(Date.now() * 0.003 + idx) * 0.08;
      w.children[0].position.y = 3.6 + Math.sin(Date.now() * 0.005 + idx) * 0.08; // Torso breathing
    });

    // First-Person Arms Movement (Breathing & Weapon Sway)
    mySpear.position.y = -0.2 + Math.sin(Date.now() * 0.004) * 0.06;
    myShield.position.y = -0.6 + Math.cos(Date.now() * 0.004) * 0.05;

    // Outrider Swarm Movement
    for (let i = 0; i < outriderCount; i++) {
      const data = outriderData[i];
      if (!data.dead) {
        data.z += data.speed;
        if (data.z > 30) data.z = -260;
      } else {
        data.z -= 0.12;
      }
      dummy.position.set(data.x, 3.0, data.z);
      dummy.rotation.x = Math.sin(Date.now() * 0.006 + i) * 0.15;
      dummy.updateMatrix();
      horde.setMatrixAt(i, dummy.matrix);
    }
    horde.instanceMatrix.needsUpdate = true;

    // Rising Golden Sunset Ash Particles
    const positions = ashGeo.attributes.position.array;
    for (let i = 1; i < ashCount * 3; i += 3) {
      positions[i] += 0.22;
      if (positions[i] > 90) positions[i] = 0;
    }
    ashGeo.attributes.position.needsUpdate = true;

    camera.lookAt(0, 4, -100);
    renderer.render(scene, camera);
  }
  animate();
</script>
</body>
</html>
